<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vigila</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Structure and presentation only. Every application value below is
         projected by the F# engine; Forma and Folio do not become authorities. -->
    <main class="app">
      <h1>Vigila</h1>

      <!-- Unexpected operational failure is a distinct Aegis presentation.
           Expected connection/capture refusals remain ordinary application
           outcomes below and are never converted into Aegis faults. -->
      <template data-if="hasOperationalFault">
        <ef-fault-inline class="ef-component-tag">
          <div
            class="ef-fault ef-fault--inline operational-fault"
            id="operational-fault"
            data-ef-intent="inline"
            data-ef-severity="error"
            role="alert"
            aria-labelledby="operational-fault-title">
            <div class="ef-fault__marker" aria-hidden="true">!</div>
            <div class="ef-fault__body">
              <p class="ef-fault__severity">Operational error</p>
              <p class="ef-fault__title" id="operational-fault-title">
                <strong data-text="operationalFaultTitle"></strong>
              </p>
              <p class="ef-fault__message" data-text="operationalFaultMessage"></p>
              <p class="ef-fault-reference">
                Reference <code data-text="operationalFaultReference"></code>
              </p>
            </div>
          </div>
        </ef-fault-inline>
      </template>

      <!-- The credential itself remains browser-side. Only the presence flag
           crosses Limen into the engine. -->
      <template data-if="needsSetup">
        <form class="setup ef-stack ef-surface" data-event="connect">
          <h2 class="setup__heading">Connect to a repository</h2>

          <div class="ef-field">
            <label class="ef-field__label setup__label" for="token">GitHub token</label>
            <input
              id="token"
              class="setup__input"
              type="password"
              autocomplete="off"
              spellcheck="false"
              aria-describedby="token-note"
            />
            <input id="token-present" type="hidden" data-event="tokenEntered" data-on="input" />
            <p id="token-note" class="ef-field__description setup__note">
              Stored locally in this browser only, and never written to your repository.
            </p>
          </div>

          <div class="ef-field">
            <label class="ef-field__label setup__label" for="repository">Repository</label>
            <input
              id="repository"
              class="setup__input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="owner/repository"
              data-event="repositoryChanged"
              data-on="input"
              data-bind-value="setupRepository"
            />
          </div>

          <div class="ef-field">
            <label class="ef-field__label setup__label" for="branch">Branch</label>
            <input
              id="branch"
              class="setup__input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              data-event="branchChanged"
              data-on="input"
              data-bind-value="setupBranch"
            />
          </div>

          <button class="setup__submit" type="submit" data-bind-disabled="connectDisabled">
            Connect
          </button>

          <template data-if="isValidating">
            <p class="setup__status" role="status" data-text="connectionStatus"></p>
          </template>

          <template data-if="hasSetupError">
            <ef-alert class="ef-component-tag">
              <aside class="ef-alert setup__error" role="alert" data-tone="attention">
                <div class="ef-alert__icon" aria-hidden="true">!</div>
                <div>
                  <strong>Connection needs attention</strong>
                  <p data-text="setupError"></p>
                </div>
              </aside>
            </ef-alert>
          </template>
        </form>
      </template>

      <template data-if="isConnected">
        <section class="workspace">
          <form class="capture ef-stack" data-event="capture">
            <div class="ef-field">
              <label class="ef-field__label capture__label" for="title">What is open?</label>
              <input
                id="title"
                class="capture__input"
                type="text"
                autocomplete="off"
                aria-describedby="capture-error"
                data-event="titleChanged"
                data-on="input"
                data-bind-value="draft"
              />
            </div>
            <button class="capture__submit" type="submit" data-bind-disabled="captureDisabled">
              Capture
            </button>
          </form>

          <template data-if="hasError">
            <ef-alert class="ef-component-tag">
              <aside id="capture-error" class="ef-alert error" role="alert" data-tone="attention">
                <div class="ef-alert__icon" aria-hidden="true">!</div>
                <p data-text="error"></p>
              </aside>
            </ef-alert>
          </template>

          <template data-if="isEmpty">
            <p class="empty">Nothing open yet.</p>
          </template>

          <template data-if="hasItems">
            <ef-work-queue class="ef-component-tag">
              <section class="ef-work-queue" aria-labelledby="open-items-title">
                <header class="ef-work-queue__header">
                  <div>
                    <span class="ef-component-kicker">Open work</span>
                    <h2 id="open-items-title">Needs your attention</h2>
                  </div>
                  <span class="ef-status-lozenge" data-state="attention">
                    <span data-text="itemCount"></span> items
                  </span>
                </header>
                <ol class="ef-work-queue__list items">
                  <template data-each="items" data-key="id">
                    <li class="ef-work-queue__item item">
                      <div>
                        <strong class="item__title" data-text="title"></strong>
                        <p class="item__meta">
                          <span class="item__kind" data-text="kind"></span>
                          <span class="item__status" data-text="status"></span>
                          <span class="item__id" data-text="id"></span>
                        </p>
                      </div>
                    </li>
                  </template>
                </ol>
              </section>
            </ef-work-queue>
          </template>

          <p class="connected ef-cluster">
            <span class="ef-status-lozenge" data-state="ok" data-text="connectionStatus"></span>
            <button class="disconnect" type="button" data-event="disconnect">
              Forget token / Disconnect
            </button>
          </p>

          <!-- Folio projects the same authoritative item state used above.
               It adds document intent only; it does not recalculate status or
               any other domain meaning. -->
          <ef-print-document class="print-surface">
            <ef-print-header>
              <header>
                <p>Vigila</p>
                <h1>Open items</h1>
              </header>
            </ef-print-header>
            <ef-print-section>
              <section>
                <h2>Items requiring attention</h2>
                <ol class="print-items">
                  <template data-each="items" data-key="id">
                    <li class="print-item">
                      <strong data-text="title"></strong>
                      <span data-text="kind"></span>
                      <span data-text="status"></span>
                      <code data-text="id"></code>
                    </li>
                  </template>
                </ol>
              </section>
            </ef-print-section>
            <ef-print-footer>
              <footer>
                <span>Vigila open-items summary</span>
                <ef-print-page-number></ef-print-page-number>
              </footer>
            </ef-print-footer>
          </ef-print-document>
        </section>
      </template>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
